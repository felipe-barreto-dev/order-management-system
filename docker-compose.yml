version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: order_management_db
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: order_management_user
      POSTGRES_PASSWORD: order_management_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_management_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=order_management;Username=order_management_user;Password=order_management_pass
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: order_management_client
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge